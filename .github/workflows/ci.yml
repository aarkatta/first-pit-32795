name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback on every push and pull request: lint, types, unit tests with
  # coverage, both builds, and the release gate. No emulators, so it finishes in
  # a couple of minutes.
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify (static)
        run: npm run verify:static

  # The Firestore/Storage rules and callable integration suites. They start the
  # Firebase emulators thirteen times, which is too slow to gate every PR, so
  # they run on main and on demand.
  emulators:
    name: Emulator and rules suites
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # The Firestore and Storage emulators are Java processes; pin the JDK
      # rather than relying on whatever the runner image ships.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: firebase-emulators-${{ runner.os }}-

      - name: Install
        run: npm ci

      - name: Emulator and rules suites
        run: npm run test:firebase
